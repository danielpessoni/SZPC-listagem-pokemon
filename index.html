<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
        Listagem Pokémon - Semana do Zero ao Programador Contratado
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="./src/css/reset.css">
    <link rel="stylesheet" href="./src/css/variaveis.css">
    <link rel="stylesheet" href="./src/css/scrollbar.css">
    <link rel="stylesheet" href="./src/css/base.css">
    <link rel="stylesheet" href="./src/css/filtros.css">
    <link rel="stylesheet" href="./src/css/pokemon.css">

	<link rel="shortcut icon" href="src/imagens/pokeball.png" type="image/x-icon">

</head>

<body>
    <header>

        <a href="#">
			<img src="./src/imagens/pokeball.png" alt="Pokébola" class="logo">
		</a>


        <button id="botao-alterar-tema">
            <img src="./src/imagens/sun.png" alt="Alterar tema" class="imagem-botao">
        </button>
    </header>

    <main>

        <section class="painel-filtros">

            <div class="grupo-filtro">
                <label for="filtro-nome">Nome</label>
                <input type="search" id="filtro-nome" class="pesquisa-pokemon" placeholder="Pesquisar Pokémon..." autocomplete="off">
            </div>

            <div class="grupo-filtro">
                <h2>Regiões</h2>

                <div class="lista-opcoes" id="lista-regioes">

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-regiao" value="kanto" checked>
                        <span class="botao-opcao regiao">Kanto</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-regiao" value="johto">
                        <span class="botao-opcao regiao">Johto</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-regiao" value="hoenn">
                        <span class="botao-opcao regiao">Hoenn</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-regiao" value="sinnoh">
                        <span class="botao-opcao regiao">Sinnoh</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-regiao" value="unova">
                        <span class="botao-opcao regiao">Unova</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-regiao" value="kalos">
                        <span class="botao-opcao regiao">Kalos</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-regiao" value="alola">
                        <span class="botao-opcao regiao">Alola</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-regiao" value="galar">
                        <span class="botao-opcao regiao">Galar</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-regiao" value="paldea">
                        <span class="botao-opcao regiao">Paldea</span>
                        <span class="divisor">|</span>
                    </label>

                </div>

                <label class="opcao-extra">
                    <input type="checkbox" id="somente-origem">
                    <span>Mostrar apenas Pokémon originários da(s) região(ões) selecionada(s)</span>
                </label>

            </div>

            <div class="grupo-filtro">
                <h2>Tipos</h2>

                <div class="lista-opcoes" id="lista-tipos">

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-tipo" value="normal">
                        <span class="botao-opcao normal">Normal</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-tipo" value="fire">
                        <span class="botao-opcao fire">Fire</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-tipo" value="water">
                        <span class="botao-opcao water">Water</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-tipo" value="electric">
                        <span class="botao-opcao electric">Electric</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-tipo" value="grass">
                        <span class="botao-opcao grass">Grass</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-tipo" value="ice">
                        <span class="botao-opcao ice">Ice</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-tipo" value="fighting">
                        <span class="botao-opcao fighting">Fighting</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-tipo" value="poison">
                        <span class="botao-opcao poison">Poison</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-tipo" value="ground">
                        <span class="botao-opcao ground">Ground</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-tipo" value="flying">
                        <span class="botao-opcao flying">Flying</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-tipo" value="psychic">
                        <span class="botao-opcao psychic">Psychic</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-tipo" value="bug">
                        <span class="botao-opcao bug">Bug</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-tipo" value="rock">
                        <span class="botao-opcao rock">Rock</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-tipo" value="ghost">
                        <span class="botao-opcao ghost">Ghost</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-tipo" value="dragon">
                        <span class="botao-opcao dragon">Dragon</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-tipo" value="dark">
                        <span class="botao-opcao dark">Dark</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-tipo" value="steel">
                        <span class="botao-opcao steel">Steel</span>
                        <span class="divisor">|</span>
                    </label>

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-tipo" value="fairy">
                        <span class="botao-opcao fairy">Fairy</span>
                        <span class="divisor">|</span>
                    </label>

                </div>

                <label class="opcao-extra">
                    <input type="checkbox" id="tipos-obrigatorios">
                    <span>Exigir todos os tipos selecionados</span>
                </label>

            </div>

            <div class="acoes-filtro">
                <button id="botao-pesquisar" class="botao-filtrar">Pesquisar</button>
            </div>

        </section>

        <ul class="listagem-pokemon" id="lista-pokemon"></ul>

        <template id="modelo-card-pokemon">

            <li class="cartao-pokemon">

                <div class="informacoes">
                    <span class="nome"></span>
                    <p class="numero"></p>
                </div>

                <img src="" alt="" class="gif">

                <ul class="tipos"></ul>

                <p class="descricao"></p>

            </li>

        </template>

    </main>

    <script type="module" src="./src/js/index.js">


    </script>


</body>


</html>
