<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
        Listagem Pokémon - Semana do Zero ao Programador Contratado
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="./src/css/reset.css">
    <link rel="stylesheet" href="./src/css/variaveis.css">
    <link rel="stylesheet" href="./src/css/scrollbar.css">
    <link rel="stylesheet" href="./src/css/base.css">
    <link rel="stylesheet" href="./src/css/filtros.css">
    <link rel="stylesheet" href="./src/css/pokemon.css">

    <link rel="shortcut icon" href="src/imagens/pokeball.png" type="image/x-icon">

</head>

<body>
    <header>

        <a href="#">
			<img src="./src/imagens/pokeball.png" alt="Pokébola" class="logo">
		</a>


        <button id="botao-alterar-tema">
            <img src="./src/imagens/sun.png" alt="Alterar tema" class="imagem-botao">
        </button>
    </header>

    <main>

        <section class="painel-filtros">

            <div class="grupo-filtro">
                <label for="filtro-nome">Nome</label>
                <input type="search" id="filtro-nome" class="pesquisa-pokemon" placeholder="Pesquisar Pokémon..." autocomplete="off">
            </div>

            <div class="grupo-filtro">
                <h2>Regiões</h2>

                <div class="lista-opcoes" id="lista-regioes">

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-regiao">
                        <span class="botao-opcao regiao"></span>

                    </label>

                </div>

                <label class="opcao-extra">
                    <input type="checkbox" id="somente-origem">
                    <span>Mostrar apenas Pokémon originários da(s) região(ões) selecionada(s)</span>
                </label>

            </div>

            <div class="grupo-filtro">
                <h2>Tipos</h2>

                <div class="lista-opcoes" id="lista-tipos">

                    <label class="opcao-filtro">
                        <input type="checkbox" class="filtro-tipo">
                        <span class="botao-opcao"></span>
                        <!--<span class="divisor">|</span>-->
                    </label>

                </div>

                <label class="opcao-extra">
                    <input type="checkbox" id="tipos-obrigatorios">
                    <span>Exigir todos os tipos selecionados</span>
                </label>

            </div>

            <div class="acoes-filtro">
                <button id="botao-pesquisar" class="botao-filtrar">Pesquisar</button>
            </div>

        </section>

        <ul class="listagem-pokemon" id="lista-pokemon"></ul>

        <template id="modelo-card-pokemon">

            <li class="cartao-pokemon">

                <div class="informacoes">
                    <span class="nome"></span>
                    <p class="numero"></p>
                </div>

                <img src="" alt="" class="gif">

                <ul class="tipos"></ul>

                <p class="descricao"></p>

            </li>

        </template>

    </main>

    <script type="module" src="./src/js/index.js">


    </script>


</body>


</html>
