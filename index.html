<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Listagem Pokémon - Semana do Zero ao Programador Contratado</title>

	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;800&display=swap" rel="stylesheet" />

	<link rel="stylesheet" href="./src/css/reset.css">
	<link rel="stylesheet" href="./src/css/variaveis.css">
	<link rel="stylesheet" href="./src/css/scrollbar.css">
	<link rel="stylesheet" href="./src/css/estilos.css">
</head>

<body>
	<header>
		<a href="#">
			<img src="./src/imagens/pokeball.png" alt="pokebola" class="logo" />
		</a>

		<button id="botao-alterar-tema">
			<img src="./src/imagens/sun.png" alt="imagem do sol" class="imagem-botao" />
		</button>
	</header>

	<main>
		<ul class="listagem-pokemon" id="lista-pokemon"></ul>
		
		<template id="modelo-card-pokemon">
			<li class="cartao-pokemon">
				<div class="informacoes">
					<span class="nome"></span>
					<p class="numero"></p>
				</div>

				<img src="" alt="" class="gif" />

				<ul class="tipos"></ul>

				<p class="descricao"></p>
			</li>
		</template>
	</main>

	<script type="module" src="./src/js/index.js"></script>
<!-- <script type="module" src="./src/js/testes/teste-pokeapi.js"></script> -->
</body>

</html>
